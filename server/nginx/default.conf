server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Cloudflare orqali kelgan mehmonning haqiqiy IP manzili
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   CF-Connecting-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Server fayllari va yashirin fayllar (.git, .env ...) tashqariga ko'rinmasin
    location ~ /\.            { return 404; }
    location ^~ /server/      { return 404; }

    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|mp3|mp4|webm|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# guber.uz — noutbukdagi server
# Ishga tushirish:  docker compose up -d   (shu "server" papkasi ichida)
name: guber

services:
  # Sayt: repozitoriy ildizidagi fayllarni (index.html, style.css, assets/ ...) tarqatadi
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"   # faqat noutbukning o'zida tekshirish uchun: http://localhost:8080

  # Cloudflare Tunnel: oq IP va port ochmasdan saytni internetga chiqaradi
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
      - TUNNEL_TRANSPORT_PROTOCOL=${CF_PROTOCOL:-auto}
    depends_on:
      - web
    profiles: ["tunnel"]      # .env da COMPOSE_PROFILES=tunnel bo'lsa yoqiladi

  # Cloudflare'ni avtomatik sozlash (bir marta):  docker compose run --rm cf-setup
  cf-setup:
    image: python:3.12-alpine
    working_dir: /work
    volumes:
      - ./:/work
    command: python -u cloudflare/setup.py
    profiles: ["setup"]
